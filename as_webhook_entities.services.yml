services:
  as_webhook_entities.image_importer:
    class: Drupal\as_webhook_entities\WebhookImageImporter
    arguments: ['@entity_type.manager', '@http_client', '@file.repository', '@logger.channel.default', '@file_system']
  as_webhook_entities.crud_manager:
    class: Drupal\as_webhook_entities\WebhookCrudManager
    arguments: ['@entity_type.manager', '@logger.channel.default', '@as_webhook_entities.image_importer', '@as_webhook_entities.paragraph_tree_builder']
  as_webhook_entities.uuid_lookup:
    class: Drupal\as_webhook_entities\WebhookUuidLookup
    arguments: ['@entity_type.manager']
  # Shared by the bulk page/landing_page migration (via a Migrate process
  # plugin) and by PageWebhookHandler for ongoing sync, so the rebuild logic
  # exists once and the two paths cannot drift apart.
  as_webhook_entities.paragraph_tree_builder:
    class: Drupal\as_webhook_entities\ParagraphTreeBuilder
    arguments: ['@entity_type.manager', '@as_webhook_entities.image_importer', '@?entity_reference_revisions.orphan_purger']
  # Batches received notifications after the listener has responded. Also a
  # kernel.terminate subscriber, which is where the drain runs.
  as_webhook_entities.queue_drainer:
    class: Drupal\as_webhook_entities\WebhookQueueDrainer
    arguments: ['@queue', '@plugin.manager.queue_worker', '@lock', '@entity_type.manager', '@module_handler', '@config.factory', '@key.repository', '@http_client', '@request_stack', '@datetime.time', '@logger.channel.default', '@as_webhook_entities.uuid_lookup']
    tags:
      - { name: event_subscriber }
